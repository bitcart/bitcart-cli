name: Release

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: prepare
    if: ${{ github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating the tag
      actions: write # starting the release run on the tag

    steps:
      - name: Tag the draft release and start its release run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          drafts=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft) | .tag_name')
          count=$(printf '%s' "$drafts" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one draft release, found $count" >&2
            exit 1
          fi
          tag=$drafts
          if ! printf '%s' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version tag on the draft release: '$tag'" >&2
            exit 1
          fi
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null); then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "Tag $tag already exists on $existing, not $GITHUB_SHA" >&2
              exit 1
            fi
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
          echo "Started the release run for $tag" >> "$GITHUB_STEP_SUMMARY"

  goreleaser:
    name: goreleaser
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # uploading release assets
      packages: write # publishing to GHCR
      id-token: write # OIDC for provenance
      attestations: write # github attestations
      artifact-metadata: write # artifact storage metadata (recommended by actions/attest)

    steps:
      - name: Name the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version tag: '$TAG'" >&2
            exit 1
          fi
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f name="Bitcart CLI v$TAG" > /dev/null
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: bitcart/bitcart-actions/actions/setup-go@master
        with:
          enable-cache: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/digests.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
