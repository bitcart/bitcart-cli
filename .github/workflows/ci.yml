name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    uses: bitcart/bitcart-actions/.github/workflows/lint.yml@master

  workflows:
    name: workflows
    uses: bitcart/bitcart-actions/.github/workflows/workflow-checks.yml@master

    permissions:
      contents: read
      security-events: write # needed for github advanced security

  build:
    name: build
    needs: [lint, workflows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: bitcart/bitcart-actions/actions/setup-go@master

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Build
        run: go build ./...
